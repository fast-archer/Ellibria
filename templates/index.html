<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ellibria AI</title>
  <style>
    /* ОБНОВЛЕННЫЕ ТЕМЫ - БЕЗ ФИОЛЕТОВОГО В КЛАССИЧЕСКИХ ТЕМАХ */
    :root {
      --bg: #1c1c1c; --bg2: #252525; --bg3: #333333;
      --border: #3f3f3f; --accent: #ffffff; --accent-hover: #e0e0e0; --accent-text: #1c1c1c;
      --text: #f0f0f0; --text2: #a1a1aa; --green: #22c55e; --radius: 12px;
      --avatar-filter: invert(1); --avatar-blend: normal;
    }
    [data-theme="light"] {
      --bg: #f9fafb; --bg2: #ffffff; --bg3: #f3f4f6; --border: #e5e7eb;
      --accent: #111827; --accent-hover: #374151; --accent-text: #ffffff; 
      --text: #1f2937; --text2: #6b7280;
      --avatar-filter: invert(0); --avatar-blend: normal;
    }
    [data-theme="purple"] {
      --bg: #0d0b14; --bg2: #16102a; --bg3: #231a3a; --border: #3d2d6e;
      --accent: #9333ea; --accent-hover: #c084fc; --accent-text: #ffffff; 
      --text: #e9d5ff; --text2: #a78bfa;
    }
    [data-theme="night"] {
      --bg: #0a0f1e; --bg2: #111827; --bg3: #1f2937; --border: #374151;
      --accent: #3b82f6; --accent-hover: #93c5fd; --accent-text: #ffffff; 
      --text: #e2e8f0; --text2: #94a3b8;
    }
    [data-theme="terminal"] {
      --bg: #050505; --bg2: #0c0c0c; --bg3: #141414; --border: #00ff6633;
      --accent: #00ff66; --accent-hover: #33ff88; --accent-text: #050505; 
      --text: #00ff66; --text2: #00aa44;
    }
    .spin-anim { animation: spin 1s linear infinite; } 
    @keyframes spin { 100% { transform: rotate(360deg); } }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; transition: background 0.3s, color 0.3s; }

    .app-container { display: flex; width: 100vw; height: 100vh; position: relative; }

    /* ── СЛЕВА: САЙДБАР ── */
    .sidebar {
      width: 260px; background: var(--bg2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0; z-index: 10;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sidebar.collapsed { width: 72px; }
    
    .sidebar-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand-section { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    
    .avatar-wrapper {
      width: 40px; height: 40px; border-radius: 0px; overflow: hidden; flex-shrink: 0;
      background: transparent;
    }
    .avatar-img { 
      width: 100%; height: 100%; object-fit: contain;
      animation: floatAvatar 4s ease-in-out infinite;
      filter: var(--avatar-filter);
      transition: filter 0.3s ease;
    }
   
    
    .agent-title { font-family: 'Cambria', serif; font-size: 1.3rem; font-weight: normal; letter-spacing: 0.5px; color: var(--text); white-space: nowrap; }
    .sidebar.collapsed .agent-title { display: none; }
    
    .sidebar-toggle-btn { background: transparent; border: none; color: var(--text2); cursor: pointer; padding: 4px; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; }
    .sidebar-toggle-btn:hover { background: var(--bg3); color: var(--text); }
    .sidebar.collapsed .sidebar-toggle-btn { margin: 0 auto; }
    .sidebar.collapsed .brand-section { display: none; }

    .nav-actions { padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; }
    .nav-btn {
      width: 100%; background: transparent; border: 1px solid transparent; color: var(--text);
      padding: 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: 0.2s;
    }
    .nav-btn:hover { background: var(--bg3); }
    .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-btn-text { white-space: nowrap; }
    
    .sidebar.collapsed .nav-actions { padding: 10px; align-items: center; }
    .sidebar.collapsed .nav-btn { width: 44px; justify-content: center; padding: 10px 0; }
    .sidebar.collapsed .nav-btn-text { display: none; }

    .history-list { flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding: 0 15px; display: flex; flex-direction: column; gap: 5px; }
    .history-title { font-size: 0.75rem; color: var(--text2); text-transform: uppercase; font-weight: 600; margin: 10px 0 5px 5px; letter-spacing: 0.5px; white-space: nowrap; }
    
    .history-item {
      padding: 10px; border-radius: 8px; color: var(--text); font-size: 0.85rem; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      transition: 0.2s; border: 1px solid transparent;
    }
    .history-item:hover { background: var(--bg3); }
    .history-item.active { background: var(--bg3); color: var(--text); font-weight: 500; }
    .history-title-text { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-del-btn { color: var(--text2); display: flex; align-items: center; justify-content: center; transition: color 0.2s; opacity: 0; }
    .history-item:hover .history-del-btn { opacity: 1; }
    .history-del-btn:hover { color: #ef4444; }
    .history-del-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; }
    
    .sidebar.collapsed .history-title, .sidebar.collapsed .history-title-text, .sidebar.collapsed .history-del-btn { display: none; }
    .sidebar.collapsed .history-item { justify-content: center; padding: 10px 0; width: 44px; margin: 0 auto; }
    .sidebar.collapsed .history-item::before { content: '💬'; font-size: 14px; }

    /* Minimalist Footer */
    .sidebar-footer { display: flex; gap: 5px; padding: 15px; align-items: center; justify-content: center; }
    .sidebar.collapsed .sidebar-footer { flex-direction: column; padding: 10px; }
    .footer-btn {
      width: 40px; height: 40px; background: transparent; border: none;
      border-radius: 8px; color: var(--text2); cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: 0.2s;
    }
    .footer-btn:hover { background: var(--bg3); color: var(--text); }
    .footer-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* ── СПРАВА: ОКНО ЧАТА ── */
    .chat-window { flex-grow: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    
    /* Welcome Screen */
    .welcome-screen { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 1; transition: opacity 0.3s; }
    .welcome-screen.hidden { opacity: 0; }
    .welcome-screen h1 { font-family: 'Cambria', serif; font-weight: normal; font-size: 3rem; margin-bottom: 10px; color: var(--text); }
    .welcome-screen p { color: var(--text2); font-size: 1.1rem; }

    .chat-messages { flex-grow: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; z-index: 2; }
    
    .msg { max-width: 80%; padding: 14px 20px; border-radius: var(--radius); line-height: 1.6; font-size: 0.95rem; word-wrap: break-word; display: flex; flex-direction: column; }
    .msg-user { background: var(--bg2); color: var(--text); align-self: flex-end; border: 1px solid var(--border); border-bottom-right-radius: 4px; }
    .msg-echo { background: transparent; color: var(--text); align-self: flex-start; max-width: 90%; padding: 10px 0; }
    .msg-error { background: #7f1d1d33; color: #f87171; border: 1px solid #7f1d1d; align-self: center; max-width: 90%; font-size: 0.85rem; }

    .msg-text { white-space: pre-wrap; }
    .msg-echo .msg-text { white-space: normal; line-height: 1.5; } 
    .msg-echo .msg-text pre { background: #0d1117; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); }
    .msg-echo .msg-text code { font-family: 'Consolas', 'Courier New', monospace; font-size: 0.9rem; }
    .msg-echo .msg-text p { margin-bottom: 10px; }
    .msg-echo .msg-text p:last-child { margin-bottom: 0; }
    .msg-actions { display: flex; gap: 8px; margin-top: 10px; opacity: 0; transition: opacity 0.2s; }
    .msg:hover .msg-actions { opacity: 1; }
    .action-btn { background: transparent; border: none; cursor: pointer; color: var(--text2); padding: 4px; display: flex; align-items: center; justify-content: center; transition: 0.2s; border-radius: 4px; }
    .action-btn svg { width: 15px; height: 15px; transition: 0.2s; }
    .action-btn:hover { color: var(--text); background: var(--bg3); }
    .heart-btn.liked { color: #ef4444 !important; }
    .heart-btn.liked svg { fill: #ef4444; stroke: #ef4444; }

    /* ── НИЖНИЙ БЛОК: СТАТУС БАР И ПОЛЕ ВВОДА ── */
    .input-wrapper-master { padding: 0 30px 30px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); z-index: 2; max-width: 900px; margin: 0 auto; width: 100%; }
    
    .floating-status-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; opacity: 0.7; transition: 0.3s; }
    .floating-status-bar:hover { opacity: 1; }
    .status-pill { background: transparent; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; color: var(--text2); display: flex; align-items: center; gap: 6px; }
    .status-pill svg { width: 13px; height: 13px; stroke: currentColor; }
    .status-pill-val { color: var(--text); font-weight: 500; }

    .chat-input-area { display: flex; gap: 12px; position: relative; }
    .input-field-container { flex-grow: 1; position: relative; display: flex; align-items: center; }
    .input-field {
      width: 100%; min-height: 54px; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 27px; color: var(--text); padding: 15px 50px 15px 25px; font-size: 1rem;
      transition: 0.2s; user-select: text; outline: none; resize: none; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .input-field:focus { border-color: var(--text2); }
    
    #emoji-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text2); cursor: pointer; outline: none; padding: 4px; transition: 0.2s; }
    #emoji-btn:hover { color: var(--text); }
    #emoji-btn svg { width: 22px; height: 22px; }

    #emoji-picker { display: none; position: absolute; bottom: 65px; right: 0; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 10px; width: 260px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); z-index: 300; }
    .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-height: 150px; overflow-y: auto; font-size: 20px; user-select: none; }
    .emoji-grid span { cursor: pointer; text-align: center; transition: transform .1s; }
    .emoji-grid span:hover { transform: scale(1.25); }

    .send-btn { width: 54px; height: 54px; background: var(--accent); border: none; flex-shrink: 0; border-radius: 50%; color: var(--accent-text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .send-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
    .send-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* Кастомное контекстное меню */
    #custom-ctx {
      display: none; position: fixed; z-index: 9999; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px; min-width: 140px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .ctx-item {
      padding: 8px 12px; cursor: pointer; color: var(--text); border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 10px; transition: 0.15s;
    }
    .ctx-item svg { width: 14px; height: 14px; stroke: var(--text2); }
    .ctx-item:hover { background: var(--bg3); color: var(--text); }
    .ctx-item:hover svg { stroke: var(--text); }

    /* Оверлей настроек и поиска */
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.2s ease-in-out; z-index: 500; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .modal { background: var(--bg2); border: 1px solid var(--border); width: 500px; max-width: 90%; max-height: 90vh; overflow-y: auto; border-radius: var(--radius); padding: 25px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .modal-header { font-size: 1.2rem; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: var(--text); }
    
    /* Специфично для поиска */
    .search-input { background: var(--bg3); border: 1px solid var(--border); color: var(--text); width: 100%; padding: 12px 15px; border-radius: 8px; font-size: 1rem; outline: none; transition: 0.2s; }
    .search-input:focus { border-color: var(--text2); }
    .search-results-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
    .search-match-item { background: var(--bg3); padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
    .search-match-item:hover { border-color: var(--border); background: var(--bg); }
    .search-match-title { font-weight: 600; font-size: 0.9rem; color: var(--text); margin-bottom: 4px; }
    .search-match-snippet { font-size: 0.8rem; color: var(--text2); font-style: italic; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; color: var(--text2); font-weight: 600; text-transform: uppercase; }
    .form-control { background: var(--bg3); border: 1px solid var(--border); color: var(--text); height: 40px; border-radius: 8px; padding: 0 12px; font-size: 0.9rem; }
    .form-control:focus { outline: none; border-color: var(--text2); }
    textarea.form-control { height: 120px; padding: 12px; resize: vertical; }
    .modal-actions { display: flex; gap: 12px; margin-top: 10px; justify-content: flex-end; }
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 500; cursor: pointer; font-size: 0.9rem; border: 1px solid transparent; transition: 0.2s; }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--bg3); }
    .btn-reset { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; align-self: flex-start; margin-top: 4px; transition: 0.2s;}
    .btn-reset:hover { background: var(--bg3); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text2); }
      </style>

<body>

  <div class="app-container">
    
    <aside class="sidebar" id="main-sidebar">
      <div class="sidebar-header">
        <div class="brand-section">          
          <div class="agent-title" id="panel-name">Ellibria</div>
        </div>
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>

      <div class="nav-actions">
        <button class="nav-btn" onclick="newChat()">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span class="nav-btn-text">New Chat</span>
        </button>
        <button class="nav-btn" onclick="openSearch()">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span class="nav-btn-text">Search</span>

      </div>

      <div class="history-list">
        <div class="history-title">History</div>
        <div id="history-list-content"></div>
      </div>

      <div class="sidebar-footer">
        <button class="footer-btn" title="Settings" onclick="openSettings()">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.48.48 0 0 0-.57-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.57.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.57.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .57-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
        <button class="footer-btn" title="Toggle Sound" onclick="toggleSound()">
          <svg viewBox="0 0 24 24" id="sound-icon"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
      </div>
    </aside>

    <main class="chat-window">
      
      <div id="welcome-screen" class="welcome-screen">
  <img src="/static/logo.png" alt="Logo" style="width: 120px; margin-bottom: 20px; filter: var(--avatar-filter);">
  <h1 id="welcome-title">Ellibria</h1>
  <p>Hi. Let's talk.</p>
</div>

      <div class="chat-messages" id="chat-box"></div>
      
      <div class="input-wrapper-master">
        <div class="floating-status-bar">
          <div class="status-pill" title="Tokens Left">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 10h8M8 14h8"/></svg>
            <span class="status-pill-val" id="val-tokens">14400</span>
          </div>
          <div class="status-pill" title="Mood">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            <span class="status-pill-val" id="val-mood">Neutral</span>
          </div>
          <div class="status-pill" title="Wishes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.5 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span class="status-pill-val" id="val-wishes">None</span>
          </div>
          <div class="status-pill" title="Mode">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 2a5 5 0 0 0-5 5v3H3v12h18V10h-4V7a5 5 0 0 0-5-5zM9 7a3 3 0 0 1 6 0v3H9V7zm10 13H5V12h14v8z"/></svg>
            <span class="status-pill-val" id="val-mode">BDSM</span>
          </div>
          <div class="status-pill" title="Model">
            <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
            <span class="status-pill-val" id="val-model">LLAMA</span>
          </div>
        </div>

        <div class="chat-input-area">
          <div class="input-field-container">
            <textarea id="user-input" class="input-field" placeholder="Type a message..." autocomplete="off" rows="1"></textarea>
            
            <button id="emoji-btn" onclick="toggleEmojiPicker(event)" title="Emojis">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <script>
    // ── СЛОВАРИ ХАРАКТЕРОВ ──────────────────────────────────
    const MODE_PROMPTS = {

    let SYSTEM_DEFAULT_PROMPT = ""; // Приходит с бэкенда

    function changeMode() {
      const mode = document.getElementById('s-mode').value;
      if (mode !== 'custom' && MODE_PROMPTS[mode]) {
        document.getElementById('s-prompt').value = MODE_PROMPTS[mode];
      }
    }

    function resetToDefaultPrompt() {
      const mode = document.getElementById('s-mode').value;
      if (mode !== 'custom' && MODE_PROMPTS[mode]) {
        document.getElementById('s-prompt').value = MODE_PROMPTS[mode];
      } else {
        document.getElementById('s-prompt').value = SYSTEM_DEFAULT_PROMPT;
      }
    }

    function toggleSidebar() {
      document.getElementById('main-sidebar').classList.toggle('collapsed');
    }

    let agentName = "Ellibria";
    let sysPrompt = "";
    let voiceLang = "en-US";
    let theme = "dark";
    let selectedMode = "bdsm";
    let soundEnabled = false;
    let savedTokens = "14400";
    let currentSessionId = null;

    window.addEventListener('DOMContentLoaded', () => {
      savedTokens = localStorage.getItem('ellibria_tokens') || "14400";
      document.getElementById('val-tokens').textContent = savedTokens;

      fetch('/get_settings')
        .then(r => r.json())
        .then(data => {
          const s = data.settings;
          agentName = s.agentName || "Ellibria";
          voiceLang = s.voiceLang || "en-US";
          theme = s.theme || "dark";
          selectedMode = s.selectedMode || "bdsm";
          sysPrompt = data.system_prompt || "";
          SYSTEM_DEFAULT_PROMPT = data.default_prompt || "";
          
          document.getElementById('panel-name').textContent = agentName;
          document.getElementById('welcome-title').textContent = agentName;
          document.getElementById('val-mode').textContent = selectedMode.toUpperCase();
          applyTheme(theme);
          
          if(data.model) document.getElementById('val-model').textContent = data.model.toUpperCase();
          
          loadSessionsList();
        }).catch(err => console.error("Error:", err));
    });

let _userOverrideTheme = false;

function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
}

    function checkWelcomeScreen() {
        const box = document.getElementById('chat-box');
        const welcome = document.getElementById('welcome-screen');
        if (box.children.length === 0) {
            welcome.classList.remove('hidden');
        } else {
            welcome.classList.add('hidden');
        }
    }

    // ── РАБОТА С СЕССИЯМИ ──
    function loadSessionsList() {
      fetch('/get_sessions').then(r => r.json()).then(data => {
        const list = document.getElementById('history-list-content');
        list.innerHTML = '';
        data.sessions.forEach(s => {
          const div = document.createElement('div');
          div.className = `history-item ${s.id === currentSessionId ? 'active' : ''}`;
          div.onclick = () => loadSession(s.id);
          
          const title = document.createElement('div');
          title.className = 'history-title-text';
          title.textContent = s.title;
          
          const delBtn = document.createElement('div');
          delBtn.className = 'history-del-btn';
          delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          delBtn.onclick = (e) => deleteSession(s.id, e);
          
          div.appendChild(title);
          div.appendChild(delBtn);
          list.appendChild(div);
        });
      });
    }

    function loadSession(id) {
      currentSessionId = id;
      document.getElementById('chat-box').innerHTML = '';
      fetch('/load_session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: id })
      }).then(r => r.json()).then(data => {
        if(data.messages) {
          data.messages.forEach(m => {
            if(m.role !== 'system') {
              renderMessageHTML(m.content, m.role === 'user' ? 'user' : 'echo');
            }
          });
        }
        checkWelcomeScreen();
        loadSessionsList();
      });
      closeSearch();
    }

    function deleteSession(id, e) {
      e.stopPropagation();
      if(confirm('Delete this chat?')) {
        fetch('/delete_session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: id })
        }).then(() => {
          if(currentSessionId === id) newChat();
          else loadSessionsList();
        });
      }
    }

    function newChat() {
      currentSessionId = null;
      document.getElementById('chat-box').innerHTML = '';
      checkWelcomeScreen();
      loadSessionsList();
    }

    // ── ПОИСК ──
    function openSearch() {
      document.getElementById('search-overlay').classList.add('open');
      document.getElementById('search-input').focus();
    }
    
    function closeSearch() {
      document.getElementById('search-overlay').classList.remove('open');
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').innerHTML = '';
    }

    let searchTimeout;
    function debounceSearch(val) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => performSearch(val), 300);
    }

    function performSearch(query) {
      const resDiv = document.getElementById('search-results');
      if (!query.trim()) { resDiv.innerHTML = ''; return; }
      
      fetch('/search_sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: query })
      }).then(r => r.json()).then(data => {
        resDiv.innerHTML = '';
        if (data.results.length === 0) {
            resDiv.innerHTML = '<div style="color:var(--text2); font-size:0.9rem; text-align:center;">No results found.</div>';
            return;
        }
        data.results.forEach(item => {
            const el = document.createElement('div');
            el.className = 'search-match-item';
            el.onclick = () => loadSession(item.id);
            
            const t = document.createElement('div');
            t.className = 'search-match-title';
            t.textContent = item.title;
            el.appendChild(t);

            item.matches.forEach(m => {
                const s = document.createElement('div');
                s.className = 'search-match-snippet';
                s.textContent = `"${m.snippet}"`;
                el.appendChild(s);
            });

            resDiv.appendChild(el);
        });
      });
    }

    // ── НАСТРОЙКИ ──
    function openSettings() {
      document.getElementById('s-name').value = agentName;
      document.getElementById('s-prompt').value = sysPrompt;
      document.getElementById('s-lang').value = voiceLang;
      document.getElementById('s-mode').value = selectedMode;
      document.getElementById('s-theme').value = theme;
      document.getElementById('settings-overlay').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settings-overlay').classList.remove('open');
    }

    function saveSettings() {
      agentName = document.getElementById('s-name').value.trim() || 'Ellibria';
      sysPrompt = document.getElementById('s-prompt').value.trim();
      voiceLang = document.getElementById('s-lang').value;
      selectedMode = document.getElementById('s-mode').value;
      theme = document.getElementById('s-theme').value;
      _userOverrideTheme = true;

      document.getElementById('panel-name').textContent = agentName;
      document.getElementById('welcome-title').textContent = agentName;
      document.getElementById('val-mode').textContent = selectedMode.toUpperCase();
      closeSettings();

      fetch('/save_settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_prompt: sysPrompt,
          agentName: agentName,
          voiceLang: voiceLang,
          theme: theme,
          selectedMode: selectedMode
        })
      }).catch(err => console.error(err));
    }

    const EMOJIS = ['😊', '❤️', '😂', '🔥', '😍', '👀', '✨', '👍', '😏', '🖤', '👻', '👑', '🥺', '💬', '✌️', '🙌', '🎉', '🌟', '💥', '🎵', '😈', '💻', '🦊', '🍷', '🚬', '⛓️', '🔪', '🥀'];
    const emojiGrid = document.getElementById('emoji-grid');
    EMOJIS.forEach(emoji => {
      const span = document.createElement('span');
      span.textContent = emoji;
      span.onclick = (e) => {
        e.stopPropagation();
        const inputField = document.getElementById('user-input');
        inputField.value += emoji;
        inputField.focus();
      };
      emojiGrid.appendChild(span);
    });

    function toggleEmojiPicker(e) {
      e.stopPropagation();
      const picker = document.getElementById('emoji-picker');
      picker.style.display = picker.style.display === 'block' ? 'none' : 'block';
    }

    // ── ОБРАБОТЧИК КОНТЕКСТНОГО МЕНЮ ──
    const inp = document.getElementById('user-input');
    const ctxMenu = document.getElementById('custom-ctx');
    
    inp.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      ctxMenu.style.left = `${e.clientX}px`;
      ctxMenu.style.top = `${e.clientY - 120}px`;
      ctxMenu.style.display = 'block';
    });

    document.addEventListener('click', e => {
      const picker = document.getElementById('emoji-picker');
      const btn = document.getElementById('emoji-btn');
      if (picker && picker.style.display === 'block' && !picker.contains(e.target) && !btn.contains(e.target)) picker.style.display = 'none';
      if (e.target.closest('#custom-ctx') === null) ctxMenu.style.display = 'none';
    });

    async function handleCtx(action) {
      ctxMenu.style.display = 'none';
      inp.focus();
      if (action === 'copy') document.execCommand('copy');
      else if (action === 'cut') document.execCommand('cut');
      else if (action === 'paste') {
        try {
          const text = await navigator.clipboard.readText();
          const start = inp.selectionStart;
          const end = inp.selectionEnd;
          inp.value = inp.value.substring(0, start) + text + inp.value.substring(end);
          inp.selectionStart = inp.selectionEnd = start + text.length;
        } catch (err) { }
      }
    }

    const SVG_COPY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
    const SVG_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const SVG_HEART = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
    const SVG_SPEAK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
    
    function renderMessageHTML(text, sender) {
      const box = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `msg msg-${sender}`;
      
      const textDiv = document.createElement('div');
      textDiv.className = 'msg-text';
      
      // Парсим Markdown только для ответов бота. Текст юзера оставляем текстом для безопасности.
      if (sender === 'echo') {
        textDiv.innerHTML = marked.parse(text);
        // Активируем подсветку синтаксиса для всех блоков кода
        textDiv.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });
      } else {
        textDiv.textContent = text;
      }
      
      msg.appendChild(textDiv);
      
      if (sender === 'echo') {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'msg-actions';

        const speakBtn = document.createElement('button');
        speakBtn.className = 'action-btn';
        speakBtn.innerHTML = SVG_SPEAK;
        speakBtn.title = 'Speak';
        speakBtn.onclick = () => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            speak(text);
          }
        };

        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn';
        copyBtn.innerHTML = SVG_COPY;
        copyBtn.title = 'Copy';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(text);
          copyBtn.innerHTML = SVG_CHECK;
          setTimeout(() => copyBtn.innerHTML = SVG_COPY, 1500);
        };

        const heartBtn = document.createElement('button');
        heartBtn.className = 'action-btn heart-btn';
        heartBtn.innerHTML = SVG_HEART;
        heartBtn.title = 'Like';
        heartBtn.onclick = () => heartBtn.classList.toggle('liked');
        
        actionsDiv.appendChild(speakBtn);
        actionsDiv.appendChild(copyBtn);
        actionsDiv.appendChild(heartBtn);
        msg.appendChild(actionsDiv);
      }

      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
      checkWelcomeScreen();
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      renderMessageHTML(text, 'user');
const sendBtn = document.querySelector('.send-btn');
const originalIcon = sendBtn.innerHTML;
// Меняем иконку на пульсирующие точки или песочные часы
sendBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin-anim"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>`;
sendBtn.style.pointerEvents = 'none'; // блокируем повторное нажатие
      input.value = '';
      document.getElementById('emoji-picker').style.display = 'none';

      fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: currentSessionId })
      })
      .then(r => r.json())
      .then(data => {
        if(data.error) throw new Error(data.error);
sendBtn.innerHTML = originalIcon;
sendBtn.style.pointerEvents = 'auto';
        
        renderMessageHTML(data.response, 'echo');
        if (soundEnabled) speak(data.response);
        
        if (data.mood) document.getElementById('val-mood').textContent = data.mood;
        if (data.wishes) document.getElementById('val-wishes').textContent = data.wishes;
        if (data.model) document.getElementById('val-model').textContent = data.model.toUpperCase();
        
        if (data.tokens_left !== undefined && data.tokens_left !== "N/A") {
          document.getElementById('val-tokens').textContent = data.tokens_left;
          localStorage.setItem('ellibria_tokens', data.tokens_left);
        }

        if (data.session_id && data.session_id !== currentSessionId) {
          currentSessionId = data.session_id;
          loadSessionsList();
        }
      })
      .catch(err => {
        renderMessageHTML(`System Error: ${err.message}`, 'error');
sendBtn.innerHTML = originalIcon;
sendBtn.style.pointerEvents = 'auto';
      });
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('sound-icon');
      if (soundEnabled) {
        icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      } else {
        icon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

    function speak(text) {

      utt.lang = voiceLang; utt.rate = 0.92; utt.pitch = 1.05;
      const voices = speechSynthesis.getVoices();

        v.lang.startsWith(voiceLang.split('-')[0]) &&
        /female|woman|girl|zira|hazel|susan|samantha/i.test(v.name));
      if (female) utt.voice = female;
      speechSynthesis.speak(utt);
    }
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
                       const userInput = document.getElementById('user-input');

// Авто-расширение поля ввода
userInput.addEventListener('input', function() {
  this.style.height = '54px'; // сбрасываем до минимума
  this.style.height = (this.scrollHeight) + 'px'; // ставим по размеру текста
  if (this.value.trim() === '') this.style.height = '54px'; // защита от залипания
});

// Отправка по Enter, перенос по Shift+Enter
userInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault(); // чтобы не делался перенос строки
    sendMessage();
    this.style.height = '54px'; // сбрасываем размер после отправки
  }
});

// Авто-синхронизация с темой Windows каждые 4 секунды
let _lastSystemTheme = null;
setInterval(async () => {
  if (_userOverrideTheme) return;
  try {
    const r = await fetch("/system_theme");
    const data = await r.json();
    if (data.theme !== _lastSystemTheme) {
      _lastSystemTheme = data.theme;
      applyTheme(data.theme === "dark" ? "dark" : "light");
    }
  } catch(e) {}
}, 4000);
  </script>
